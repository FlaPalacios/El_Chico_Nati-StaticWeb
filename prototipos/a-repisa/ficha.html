<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>A · Ficha · El Chico Naturista</title>
<script>document.documentElement.classList.add('js');</script>
<style>
@font-face { font-family: 'Hind'; src: url('../fuentes/hind-600.woff2') format('woff2'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Hind'; src: url('../fuentes/hind-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
@font-face { font-family: 'Amulya'; src: url('../fuentes/amulya-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Amulya'; src: url('../fuentes/amulya-500.woff2') format('woff2'); font-weight: 500; font-display: swap; }

:root {
  --niebla: #F7F7F7; --monte: #1C3A31; --salvia: #2F5D50; --jade: #7A9B87; --papel: #FFFFFF; --cafe: #211E1E;
  --monte-suave: color-mix(in srgb, var(--monte) 72%, var(--niebla));
  --sombra: color-mix(in srgb, var(--monte) 22%, transparent);
  --linea: color-mix(in srgb, var(--monte) 14%, transparent);
  --canto: color-mix(in srgb, var(--salvia) 22%, var(--niebla));
  --salvia-hundido: color-mix(in srgb, var(--salvia) 85%, var(--monte));
  --titular: 'Hind', system-ui, sans-serif; --texto: 'Amulya', Georgia, serif;
  --curva: cubic-bezier(.2, .7, .2, 1); --margen: 16px; --lado: 170px;
}
@media (min-width: 900px) { :root { --margen: 48px; --lado: 230px; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--niebla); color: var(--monte); font: 400 1.0625rem/1.6 var(--texto); }
a { color: inherit; } img { display: block; max-width: 100%; }
:focus-visible { outline: 3px solid var(--jade); outline-offset: 3px; border-radius: 2px; }
@media (prefers-reduced-motion: no-preference) {
  @view-transition { navigation: auto; }
  ::view-transition-group(*) { animation-duration: .45s; animation-timing-function: var(--curva); }
}

.cabecera { display: flex; align-items: center; gap: 12px; padding: 14px var(--margen); }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 700 1.125rem/1 var(--titular); }
.marca img { width: 44px; height: 44px; }
.carrito { margin-left: auto; position: relative; display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 50%; background: var(--papel); border: 1px solid var(--linea); }
.carrito svg { width: 22px; height: 22px; }
.contador { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--salvia); color: var(--papel); font: 600 .75rem/20px var(--titular); text-align: center; }
.contador.salta { animation: salta .45s var(--curva); }
@keyframes salta { 40% { transform: scale(1.35); } }

.ruta { padding: 4px var(--margen) 0; font-size: .9375rem; color: var(--monte-suave); }
.ruta a { text-decoration-color: var(--linea); }

.ficha { display: grid; gap: 28px; padding: 8px var(--margen) 0; }
@media (min-width: 900px) { .ficha { grid-template-columns: 1.1fr 1fr; gap: 64px; align-items: start; padding-top: 24px; } }

/* La repisa de un solo producto */
/* Fondo explícito: sticky crea su propia capa y sin él la mezcla "multiply" no tiene contra qué fundirse */
.vitrina { position: relative; display: flex; justify-content: center; align-items: flex-end; gap: 28px; padding: 24px 0 21px; min-height: 280px;
  background-color: var(--niebla);
  background-image:
    linear-gradient(var(--salvia), var(--salvia)),
    linear-gradient(var(--canto), var(--canto));
  background-repeat: no-repeat;
  background-position: 0 calc(100% - 16px), 0 calc(100% - 4px);
  background-size: 100% 5px, 100% 12px; }
@media (min-width: 900px) { .vitrina { position: sticky; top: 24px; min-height: 520px; } }
.vitrina figure { position: relative; margin: 0; }
.vitrina img { width: calc(var(--lado) / sqrt(var(--r))); aspect-ratio: 1 / var(--r); height: auto; mix-blend-mode: multiply; }
.vitrina .reverso img { width: calc(var(--lado) * .62 / sqrt(var(--r))); }
.vitrina figure::after { content: ''; position: absolute; left: 8%; right: 8%; bottom: -6px; height: 12px; background: radial-gradient(closest-side, var(--sombra), transparent); }
.vitrina figcaption { position: absolute; left: 0; right: 0; bottom: -46px; text-align: center; font-size: .8125rem; color: var(--monte-suave); }

.datos .marca-producto { margin: 0; font: 600 .9375rem/1.2 var(--titular); color: var(--monte-suave); }
.datos h1 { margin: 6px 0 4px; font: 700 clamp(2.1rem, 8vw, 3.6rem)/.98 var(--titular); letter-spacing: -.02em; }
.datos .presentacion { margin: 0; color: var(--monte-suave); }
.precio { margin: 18px 0 0; font: 700 2rem/1 var(--titular); font-variant-numeric: tabular-nums; }
.corta { margin: 12px 0 0; max-width: 46ch; }

.compra { display: grid; grid-template-columns: auto 1fr; gap: 10px; margin-top: 22px; }
.cantidad { display: inline-flex; align-items: center; border: 1px solid var(--linea); background: var(--papel); border-radius: 999px; }
.cantidad button { width: 44px; height: 48px; border: 0; background: none; font: 600 1.25rem/1 var(--titular); color: var(--monte); cursor: pointer; border-radius: 999px; }
.cantidad output { min-width: 2ch; text-align: center; font: 600 1.0625rem/1 var(--titular); font-variant-numeric: tabular-nums; }
.agregar { height: 50px; border: 0; border-radius: 999px; background: var(--salvia); color: var(--papel); font: 600 1.0625rem/1 var(--titular); cursor: pointer; transition: background-color .15s; }
.agregar:hover { background: var(--salvia-hundido); }
.agregar:active { transform: scale(.98); }
.consulta { display: inline-block; margin-top: 14px; font: 600 1rem/1.3 var(--titular); }

.detalle { margin-top: 36px; display: grid; gap: 26px; max-width: 62ch; }
.detalle h2 { margin: 0 0 6px; font: 700 1.25rem/1.2 var(--titular); }
.detalle p { margin: 0; }
.beneficios { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.beneficios li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: baseline; }
.beneficios li::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--jade); translate: 0 -1px; }

.pie { margin-top: 72px; padding: 32px var(--margen) 96px; background: var(--salvia); color: var(--papel); }
.pie p { margin: 0 0 10px; } .pie .aviso-legal { font-size: .875rem; opacity: .85; }
.flotante { position: fixed; right: 16px; bottom: 16px; width: 56px; height: 56px; border-radius: 50%; background: var(--salvia); color: var(--papel); display: grid; place-items: center; box-shadow: 0 6px 18px var(--sombra); }
.flotante svg { width: 28px; height: 28px; }
.aviso { position: fixed; left: 50%; bottom: 88px; translate: -50% 0; padding: 10px 16px; background: var(--monte); color: var(--papel); font: 500 .9375rem/1.3 var(--texto); opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .3s var(--curva); pointer-events: none; white-space: nowrap; }
.aviso.visible { opacity: 1; transform: none; }
</style>
</head>
<body>
<header class="cabecera">
  <a class="marca" href="portada.html"><img src="../img/logo-192.webp" alt="" width="44" height="44">El Chico Naturista</a>
  <a class="carrito" href="#" aria-label="Carrito">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.4 10.2a2 2 0 0 1-2 1.8H8.4a2 2 0 0 1-2-1.8z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
    <span class="contador" data-contador hidden>0</span>
  </a>
</header>
<nav class="ruta" aria-label="Ruta" id="ruta"></nav>
<main class="ficha" id="ficha" data-producto></main>
<footer class="pie">
  <p><strong>El Chico Naturista</strong>. Productos naturales del Perú.</p>
  <p class="aviso-legal">Los suplementos no son medicamentos y no reemplazan una alimentación variada.</p>
</footer>
<a class="flotante" href="#" aria-label="Escribir por WhatsApp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/></svg></a>
<div class="aviso" data-aviso role="status" aria-live="polite"></div>

<script src="../datos.js"></script>
<script src="../comun.js"></script>
<script>
(function () {
  var E = window.ECN;
  var p = E.buscar(new URLSearchParams(location.search).get('p') || 'ECN-001') || E.productos[0];
  document.title = p.nombre + ' · A · El Chico Naturista';
  document.getElementById('ruta').innerHTML = '<a href="portada.html">Inicio</a> / ' + p.categoria + ' / ' + p.subcategoria;

  var fotos = '<figure style="--r:' + p.proporcion + '"><img src="' + E.foto(p.imagenes[0], 700, 'silueta') + '" alt="' + p.nombre + ', frente del empaque" style="view-transition-name:f-' + p.codigo + '"></figure>';
  if (p.imagenes[1]) {
    fotos += '<figure class="reverso" style="--r:' + p.proporcion + '"><img src="' + E.foto(p.imagenes[1], 500, 'silueta') + '" alt="' + p.nombre + ', reverso con la información del empaque"><figcaption>Reverso</figcaption></figure>';
  }
  var seccion = function (titulo, cuerpo) { return cuerpo ? '<section><h2>' + titulo + '</h2>' + cuerpo + '</section>' : ''; };

  document.getElementById('ficha').innerHTML =
    '<div class="vitrina">' + fotos + '</div>' +
    '<div class="datos">' +
      '<p class="marca-producto">' + p.marca + '</p>' +
      '<h1>' + p.nombre + '</h1>' +
      '<p class="presentacion">' + p.presentacion + '</p>' +
      '<p class="precio">' + E.soles(p.precio) + '</p>' +
      '<p class="corta">' + p.corta + '</p>' +
      '<div class="compra">' +
        '<div class="cantidad" data-cantidad><button type="button" data-menos aria-label="Quitar uno">−</button><output aria-live="polite">1</output><button type="button" data-mas aria-label="Agregar uno">+</button></div>' +
        '<button class="agregar" type="button" data-agregar="' + p.nombre + '">Agregar al carrito</button>' +
      '</div>' +
      '<a class="consulta" href="#">Consultar por WhatsApp</a>' +
      '<div class="detalle">' +
        seccion('Qué es', p.larga ? '<p>' + p.larga + '</p>' : '') +
        seccion('Beneficios', p.beneficios.length ? '<ul class="beneficios">' + p.beneficios.map(function (b) { return '<li>' + b + '</li>'; }).join('') + '</ul>' : '') +
        seccion('Modo de uso', p.uso ? '<p>' + p.uso + '</p>' : '') +
      '</div>' +
    '</div>';
})();
</script>
</body>
</html>
